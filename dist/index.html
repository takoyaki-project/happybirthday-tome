<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fcf4f7">
  <meta name="description" content="自分のために、思いっきりふーっ。声やタップでろうそくを消す、ちいさな誕生日パーティー。">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>自分に、おめでとう。 | happybirthday-tome</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main id="party" class="party" data-scene="entry">
    <div class="brand">
      <h1>HAPPY BIRTHDAY <span>TO ME.</span></h1>
      <p>ひとりでも、主役。</p>
    </div>
    <section class="message-card" aria-label="誕生日の準備とメッセージ">
      <form id="setup" autocomplete="off">
        <div class="card-heading"><p>本日の主役、入場です。</p><h2>自分に、おめでとう。</h2></div>
        <div class="field"><label for="name">名前</label><input id="name" type="text" maxlength="30" autocomplete="off" spellcheck="false"></div>
        <div class="field"><label for="count">ろうそくの本数 <span>1〜99本</span></label><div class="number-field"><input id="count" type="number" min="1" max="99" step="1" value="5" inputmode="numeric" required autocomplete="off"><span>本</span></div></div>
        <button id="start" class="primary" type="submit">パーティスタート</button>
      </form>
      <div id="started" class="started" hidden>
        <div class="card-copy">
          <div class="card-heading"><p id="dedication">今日の主役へ</p><h2 id="cake-heading">願いごと、決まった？</h2></div>
          <p id="message-slot" class="message-slot">願いごとをひとつ。あとは、思いっきりふーっ。</p>
        </div>
      </div>
    </section>
    <section class="stage" aria-label="バースデーケーキ">
      <div id="scene-copy" class="scene-copy" aria-live="polite">
        <p id="song-lyrics" class="song-lyrics" hidden>歌詞はここに表示</p>
        <div id="blackout-copy" class="blackout-copy" hidden>しーっ。願いごとの時間。</div>
        <div id="celebration-copy" class="celebration-copy" hidden><h2 id="celebration-title">ぜんぶ消えた。おめでとう！</h2><p id="celebration-message"></p><p id="audio-note" class="audio-note" hidden>音が出ないときは、マナーモード・消音設定と音量を確認してください。</p></div>
      </div>
      <div id="scene-controls" class="scene-controls"><button id="resume" class="primary" type="button" hidden>タップして再開</button><button id="fallback" class="secondary" type="button" hidden>マイクを使わずに始める</button><button id="sound-test" class="icon-button" type="button" aria-label="音の確認" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4Z"/><path d="M17 8q4 4 0 8M20 5q7 7 0 14"/></svg></button><button id="reset" class="icon-button" type="button" aria-label="もう一度、火をつける" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8a8 8 0 1 1-1 7M5 3v5h5"/></svg></button><button id="debug-toggle" class="icon-button debug-toggle" type="button" aria-label="現在の音量の数値を隠す" aria-pressed="true" hidden>数</button></div>
      <div id="smoke" class="smoke" aria-hidden="true" hidden><span></span><span></span><span></span><span></span><span></span></div>
      <div id="blow-cue" class="blow-cue" hidden>
        <div id="bubble" class="bubble" aria-hidden="true">ふーっ<span>！</span></div>
        <span id="counter" class="counter">あと <strong id="remaining">5</strong> 本</span>
      </div>
      <button id="cake-button" class="cake-button" type="button" aria-label="ケーキをタップしてろうそくを消す" disabled>
          <svg id="cake" viewBox="0 95 360 230" role="img" aria-labelledby="cake-title"><title id="cake-title">5本のろうそくが立ったケーキ</title>
            <ellipse cx="180" cy="295" rx="163" ry="28" fill="var(--color-cake-plate)"/>
            <ellipse cx="180" cy="286" rx="164" ry="27" fill="var(--color-card)" stroke="var(--color-text)" stroke-width="2"/>
            <path d="M32 199v63c0 79 296 79 296 0v-63Z" fill="var(--color-cake-side)" stroke="var(--color-text)" stroke-width="2"/>
            <path d="M33 242c65 43 228 43 294 0v16c-65 45-229 45-294 0Z" fill="var(--color-cake-stripe)"/>
            <path d="M32 199v24q10 22 21 0v11q12 22 23 0v10q12 22 24 0v9q12 19 24 0v7q13 20 25 0v5q15 18 29 0v-2q14 24 29 0v-3q13 18 26-2v-7q12 19 25-3v-10q13 18 24-4v-10q13 14 24-8v-11q12 10 22-9v-27Z" fill="var(--color-cake-cream)"/>
            <ellipse cx="180" cy="199" rx="148" ry="62" fill="var(--color-cake-cream)" stroke="var(--color-text)" stroke-width="2"/>
            <ellipse cx="180" cy="199" rx="135" ry="52" fill="none" stroke="var(--color-cake-dots)" stroke-width="2" stroke-dasharray="2 9" stroke-linecap="round"/>
            <g id="candles"></g>
            <path d="m167 285 13-8 13 8-13 8Z" fill="var(--color-emphasis)"/><path d="m167 285-10-6v12Zm26 0 10-6v12Z" fill="var(--color-emphasis)"/>
          </svg>
      </button>
      <div id="volume-area" class="volume-area" hidden>
        <div class="volume-label"><span>声のボリューム <output id="debug-value" aria-label="現在の音量">0.000</output></span><span>小さく ー 大きく</span></div>
        <div id="meter" class="meter" role="meter" aria-label="声の大きさ" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="meter-fill"></div></div>
      </div>
      <div id="mob-crowd" class="mob-crowd" aria-label="お祝いのモブ" hidden></div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>
  </main>
</body>
</html>
