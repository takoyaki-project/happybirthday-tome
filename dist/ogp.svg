      <rect x="-5" y="-40" width="10" height="40" rx="3" fill="#8f68bc" stroke="#74539d" stroke-width="1"/>
      <path d="M-5-31 5-25M-5-17 5-11" stroke="#fff7df" stroke-width="4"/>
      <path d="M0-40v-6" stroke="#68434d" stroke-width="2" stroke-linecap="round"/>
      <circle cx="0" cy="-55" r="20" fill="url(#flame-glow)"/>
      <path d="M0-68C-6-61-8-56-6-52c1 4 4 6 6 6s5-2 6-6C8-56 6-61 0-68Z" fill="url(#flame)"/>
    </g>
