<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#fff8f1"/><stop offset="1" stop-color="#fce4dc"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#fffdf8" stop-opacity=".9"/><stop offset="1" stop-color="#fffdf8" stop-opacity="0"/></radialGradient>
    <linearGradient id="curtain"><stop stop-color="#582043"/><stop offset=".55" stop-color="#915272"/><stop offset="1" stop-color="#4b1d3d"/></linearGradient>
    <filter id="cake-shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="17" flood-color="#5b3147" flood-opacity=".23"/></filter>
    <filter id="mob-shadow" x="-25%" y="-20%" width="150%" height="155%"><feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#71495c" flood-opacity=".23"/></filter>
    <filter id="soft-shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#9a6a7e" flood-opacity=".12"/></filter>
    <radialGradient id="flame-glow"><stop stop-color="#ffe9a6" stop-opacity=".75"/><stop offset="1" stop-color="#ffe9a6" stop-opacity="0"/></radialGradient>
    <linearGradient id="flame" x1="0" x2="0" y2="1"><stop stop-color="#fff8d7"/><stop offset=".48" stop-color="#ffd16c"/><stop offset="1" stop-color="#ef7c50"/></linearGradient>
    <g id="pink-candle">
      <ellipse cx="0" cy="0" rx="7" ry="2.5" fill="#985b8d" opacity=".28"/>
      <rect x="-5" y="-40" width="10" height="40" rx="3" fill="#e77ea5" stroke="#b95e89" stroke-width="1"/>
      <path d="M-5-31 5-25M-5-17 5-11" stroke="#fff7df" stroke-width="4"/>
      <path d="M0-40v-6" stroke="#68434d" stroke-width="2" stroke-linecap="round"/>
      <circle cx="0" cy="-55" r="20" fill="url(#flame-glow)"/>
      <path d="M0-68C-6-61-8-56-6-52c1 4 4 6 6 6s5-2 6-6C8-56 6-61 0-68Z" fill="url(#flame)"/>
    </g>
    <g id="plum-candle">
