  <text x="92" y="176" fill="#8f5973" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="6">HAPPY BIRTHDAY</text>
  <g fill="#39233f" font-family="Yu Gothic, Hiragino Kaku Gothic ProN, Noto Sans CJK JP, sans-serif" font-size="68" font-weight="800" filter="url(#soft-shadow)">
    <text x="84" y="286">きょうは、</text>
    <text x="84" y="376">あなたが主役。</text>
  </g>
  <text x="91" y="447" fill="#76586a" font-family="Yu Gothic, Hiragino Kaku Gothic ProN, Noto Sans CJK JP, sans-serif" font-size="26" font-weight="500">ふーっと吹いて、お祝いしよう。</text>
  <path d="M92 500h384" stroke="#d3b8bf" stroke-width="2"/>
  <text x="91" y="549" fill="#79586a" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2.4">TAKOYAKI PROJECT</text>
  <ellipse cx="912" cy="515" rx="230" ry="36" fill="#b47c83" opacity=".14"/>
  <image x="634" y="290" width="123" height="163" xlink:href="assets/mob-mint-bunny-v2.png" filter="url(#mob-shadow)"/>
  <image x="1054" y="266" width="108" height="119" xlink:href="assets/mob-chick-v2.png" filter="url(#mob-shadow)"/>
  <image x="690" y="255" width="464" height="303" xlink:href="assets/cake-base-v2.png" filter="url(#cake-shadow)"/>
  <g aria-label="火のついたろうそくが5本" role="img">
    <use xlink:href="#pink-candle" transform="translate(808 361)"/>
    <use xlink:href="#plum-candle" transform="translate(860 344)"/>
    <use xlink:href="#pink-candle" transform="translate(911 341)"/>
    <use xlink:href="#plum-candle" transform="translate(962 344)"/>
    <use xlink:href="#pink-candle" transform="translate(1014 361)"/>
