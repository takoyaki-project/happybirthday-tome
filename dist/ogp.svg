  <rect width="1200" height="630" fill="url(#paper)"/>
  <ellipse cx="585" cy="120" rx="540" ry="340" fill="url(#glow)"/>
  <rect x="27" y="26" width="1146" height="578" rx="30" fill="none" stroke="#d8b9c6" stroke-opacity=".74" stroke-width="2"/>
  <path d="M0 0h270c-7 44-43 75-104 94C95 117 35 101 0 52Z" fill="url(#curtain)" opacity=".9"/>
  <path d="M1200 0H930c7 44 43 75 104 94 71 23 131 7 166-42Z" fill="url(#curtain)" opacity=".9"/>
  <g stroke="#f3c4d5" opacity=".18" stroke-width="4"><path d="M36 0 61 80M86 0l29 97M145 0l24 92M201 0l12 77"/><path d="M1164 0l-25 80M1114 0l-29 97M1055 0l-24 92M999 0l-12 77"/></g>
