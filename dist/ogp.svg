  <image x="618" y="415" width="128" height="143" xlink:href="assets/mob-purple-bear-v2.png" filter="url(#mob-shadow)"/>
  <image x="1062" y="398" width="118" height="130" xlink:href="assets/mob-coral-pup-v2.png" filter="url(#mob-shadow)"/>
